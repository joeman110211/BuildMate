name: BuildPair End-to-End

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS BuildPair URL to test'
        required: false
        default: 'https://staging.buildpair.co.uk'
        type: string
      external_integrations:
        description: 'Also exercise Gemini and Cloudinary integration checks'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: buildpair-e2e-${{ inputs.base_url || 'staging' }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://staging.buildpair.co.uk' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_EXTERNAL: ${{ (github.event_name == 'schedule' || inputs.external_integrations) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Validate target and Clerk test access
        shell: bash
        run: |
          set -euo pipefail
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "::error::base_url must start with https://"; exit 1 ;;
          esac
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Add the staging Clerk secret key to this repository as an Actions secret named CLERK_SECRET_KEY before running E2E."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Wait for staging readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "$E2E_BASE_URL/api/readiness" | jq -e '.ready == true' >/dev/null 2>&1; then
              echo "BuildPair staging is ready."
              exit 0
            fi
            echo "Waiting for staging readiness ($attempt/60)..."
            sleep 5
          done
          echo "::error::BuildPair staging did not become ready in time"
          exit 1

      - name: Load target Clerk publishable key
        shell: bash
        run: |
          set -euo pipefail
          config=$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$E2E_BASE_URL/api/client-config")
          key=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
          if [ -z "$key" ]; then
            echo "::error::Target Clerk publishable key is missing"
            exit 1
          fi
          echo "CLERK_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install isolated E2E tooling
        run: npm install --no-save --package-lock=false @playwright/test@latest @clerk/testing@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run every BuildPair browser journey and feature matrix
        run: npx playwright test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
