name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: qrrcn7ma

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve public runtime configuration
        shell: bash
        run: |
          set -euo pipefail

          api_url="${EXPO_PUBLIC_API_URL:-https://buildmate-nine.vercel.app}"
          clerk_key="${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
          stripe_key="${EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"

          if [ -z "$clerk_key" ] || [ -z "$stripe_key" ]; then
            html="$(curl -fsSL "$api_url")"
            js_path="$(printf '%s' "$html" | grep -oE '/_expo/static/js/web/entry-[^"[:space:]]+\.js' | head -n 1)"
            test -n "$js_path" || { echo "Could not locate BuildMate web bundle"; exit 1; }

            bundle_file="$(mktemp)"
            curl -fsSL "$api_url$js_path" -o "$bundle_file"

            mapfile -t public_keys < <(grep -oE 'pk_(test|live)_[A-Za-z0-9_.$-]+' "$bundle_file" | sort -u)
            echo "Found ${#public_keys[@]} public key candidates in deployed web bundle"
            for key in "${public_keys[@]}"; do
              echo "PUBLIC_KEY_CANDIDATE=$key"
            done

            for key in "${public_keys[@]}"; do
              suffix="${key#pk_test_}"
              suffix="${suffix#pk_live_}"
              normalized="$(printf '%s' "$suffix" | tr '_-' '/+')"
              case $((${#normalized} % 4)) in
                2) normalized="${normalized}==" ;;
                3) normalized="${normalized}=" ;;
              esac
              decoded="$(printf '%s' "$normalized" | base64 -d 2>/dev/null || true)"

              if printf '%s' "$decoded" | grep -qiE 'clerk|accounts\.dev'; then
                clerk_key="$key"
              elif [ -z "$stripe_key" ] && [[ "$key" == pk_test_51* || "$key" == pk_live_51* ]]; then
                stripe_key="$key"
              fi
            done
          fi

          test -n "$clerk_key" || { echo "Missing EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY"; exit 1; }
          test -n "$stripe_key" || { echo "Missing EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY"; exit 1; }

          {
            echo "EXPO_PUBLIC_API_URL=$api_url"
            echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$clerk_key"
            echo "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=$stripe_key"
          } >> "$GITHUB_ENV"

      - name: Require runtime configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "Missing EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "Missing EXPO_PUBLIC_API_URL"; exit 1; }
          test -n "$EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY" || { echo "Missing EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY"; exit 1; }

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buildmate-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
