name: Production Smoke Test

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: buildmate-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://buildmate-nine.vercel.app
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve commit for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "EXPECTED_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Wait for Vercel Git deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            payload=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/status")
            state=$(printf '%s' "$payload" | jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "pending"')
            echo "Vercel status: $state (attempt $attempt/36)"
            case "$state" in
              success) break ;;
              failure|error) echo "::error::Vercel deployment failed for $EXPECTED_SHA"; exit 1 ;;
            esac
            if [ "$attempt" -eq 36 ]; then
              echo "::error::Timed out waiting for Vercel deployment of $EXPECTED_SHA"
              exit 1
            fi
            sleep 10
          done

      - name: Verify production API and database
        shell: bash
        run: |
          set -euo pipefail
          health_file=$(mktemp)
          health_status=$(curl --silent --show-error --retry 4 --retry-delay 3 \
            -o "$health_file" -w '%{http_code}' "$BASE_URL/api/health" || true)
          cat "$health_file"
          printf '\n'
          if [ "$health_status" != "200" ]; then
            echo "::error::Production health endpoint returned HTTP $health_status"
            exit 1
          fi
          jq -e '.status == "ok" and .database == "ok"' "$health_file" > /dev/null

          traders_file=$(mktemp)
          curl --fail --show-error --silent --retry 8 --retry-delay 3 "$BASE_URL/api/traders" -o "$traders_file"
          jq -e 'type == "array"' "$traders_file" > /dev/null

          jobs_file=$(mktemp)
          curl --fail --show-error --silent --retry 8 --retry-delay 3 "$BASE_URL/api/public/jobs" -o "$jobs_file"
          jq -e 'type == "array" and length > 0' "$jobs_file" > /dev/null
          echo "Production API, Neon database, trader directory and live public jobs are responding."

      - name: Verify public auth entry points
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/auth/sign-in" > /dev/null
          curl --fail --show-error --silent --retry 4 --retry-delay 2 "$BASE_URL/auth/sign-up" > /dev/null
          echo "Production sign-in and sign-up pages are serving successfully."

      - name: Verify production integration configuration and schema
        shell: bash
        run: |
          set -euo pipefail
          readiness_file=$(mktemp)
          readiness_status=$(curl --silent --show-error --retry 4 --retry-delay 3 \
            -o "$readiness_file" -w '%{http_code}' "$BASE_URL/api/readiness" || true)
          cat "$readiness_file"
          printf '\n'
          if [ "$readiness_status" != "200" ]; then
            missing=$(jq -r '[(.missing // []), (.missingSchema // [])] | flatten | join(", ")' "$readiness_file" 2>/dev/null || true)
            echo "::error::Production readiness incomplete${missing:+: $missing}"
            exit 1
          fi
          jq -e '.ready == true and .status == "ready"' "$readiness_file" > /dev/null
          echo "Production integrations and required database schema are ready."
