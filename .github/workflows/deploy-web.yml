name: Deploy Web

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildmate-production-web
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_IFj5B0CLFEKezv3Z5MRTTfDT
  VERCEL_PROJECT_ID: prj_NPfSapewQCfCwWFKQa1C9R7CWQK6
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require Vercel deployment token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing GitHub Actions secret VERCEL_TOKEN. Production deployment cannot run."; exit 1; }

      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed $DEPLOY_URL"

      - name: Smoke test production
        shell: bash
        run: |
          BASE_URL="${{ steps.deploy.outputs.url }}"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 "$BASE_URL/api/health"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 "$BASE_URL/api/traders" > /dev/null
          echo "Production health and public trader API are responding."
