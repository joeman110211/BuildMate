name: Security upgrade validation

on:
  push:
    branches: [chore/security-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-upgrade-validation
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npx expo-doctor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx expo export --platform android --output-dir dist/android
      - run: npx expo export --platform ios --output-dir dist/ios
      - run: npm audit --omit=dev --audit-level=high
