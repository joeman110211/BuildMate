name: Apply BuildPair Rebrand

on:
  push:
    branches:
      - rebrand/buildpair

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-shot BuildPair rebrand apply workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebrand/buildpair
      - name: Replace legacy brand identifiers
        run: |
          set -euo pipefail
          git grep -Il -e 'BuildMate' -e 'buildmate' -e 'BUILDMATE' -- ':!/.github/workflows/rebrand-audit.yml' ':!/.github/workflows/rebrand-apply.yml' | while IFS= read -r file; do
            perl -0pi -e 's/BuildMate/BuildPair/g; s/buildmate/buildpair/g; s/BUILDMATE/BUILDPAIR/g' "$file"
          done

          # Keep live infrastructure compatibility until those resources are renamed.
          perl -0pi -e 's#https://github\.com/joeman110211/BuildPair\.git#https://github.com/joeman110211/BuildMate.git#g; s#cd BuildPair#cd BuildMate#g' README.md
          perl -0pi -e 's#https://buildpair-nine\.vercel\.app#https://buildmate-nine.vercel.app#g' .github/workflows/deploy-web.yml .github/workflows/android-apk.yml
          perl -0pi -e 's/buildpair_migrations/buildmate_migrations/g' scripts/migrate.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebrand product from BuildMate to BuildPair'
          git push origin HEAD:rebrand/buildpair
