name: BuildPair End-to-End

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'HTTPS BuildPair URL to test'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'playwright.config.mjs'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: buildpair-e2e-${{ inputs.base_url || 'staging' }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://staging.buildpair.co.uk' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.1
          cache: npm

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Validate target and Clerk test access
        shell: bash
        run: |
          set -euo pipefail
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "::error::base_url must start with https://"; exit 1 ;;
          esac
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Add CLERK_SECRET_KEY to this repository's Actions secrets before running E2E."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Wait for staging readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "$E2E_BASE_URL/api/readiness" | jq -e '.ready == true' >/dev/null 2>&1; then
              echo "BuildPair staging is ready."
              exit 0
            fi
            echo "Waiting for staging readiness ($attempt/45)..."
            sleep 4
          done
          echo "::error::BuildPair staging did not become ready in time"
          exit 1

      - name: Load target Clerk publishable key
        shell: bash
        run: |
          set -euo pipefail
          config=$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$E2E_BASE_URL/api/client-config")
          key=$(printf '%s' "$config" | jq -r '.clerkPublishableKey // empty')
          if [ -z "$key" ]; then
            echo "::error::Target Clerk publishable key is missing"
            exit 1
          fi
          echo "CLERK_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Install isolated E2E tooling
        run: npm install --no-save --package-lock=false @playwright/test@latest @clerk/testing@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run BuildPair real signup, lifecycle and mobile regressions
        run: npx playwright test --project=real-signup-journey --project=desktop-core-flow --project=small-android-public-ui

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildpair-e2e-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
