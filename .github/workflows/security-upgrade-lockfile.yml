name: Security upgrade lockfile

on:
  push:
    branches: [chore/security-upgrade]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/security-upgrade
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Upgrade core dependencies
        run: |
          npm install expo@~57.0.19 @clerk/expo@4.6.4 drizzle-orm@0.45.2
          npx expo install --fix
          npx expo install @stripe/stripe-react-native
      - name: Commit dependency graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore: upgrade Expo Clerk and Drizzle"
            git push origin HEAD:chore/security-upgrade
          fi
      - name: Validate upgraded stack
        run: |
          npx expo-doctor
          npm run lint
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high || true
