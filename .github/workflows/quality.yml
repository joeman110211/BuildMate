name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Export web
        run: npm run build:web
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high --json 2>&1)"
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$output"
              exit 0
            fi

            case "$output" in
              *"Service Unavailable"*|*"ETIMEDOUT"*|*"EAI_AGAIN"*|*"ECONNRESET"*|*"502 Bad Gateway"*|*"503 Service Unavailable"*|*"504 Gateway Timeout"*|*"429 Too Many Requests"*)
                echo "npm audit service unavailable (attempt $attempt/3)"
                if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
                ;;
              *)
                printf '%s\n' "$output"
                exit "$code"
                ;;
            esac
          done

          echo "::warning::npm audit service unavailable after 3 attempts; code/build checks passed"

  core-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buildpair_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buildpair_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      BUILDPAIR_E2E_MODE: '1'
      BUILDPAIR_E2E_TOKEN: 'buildpair-ci-e2e-only'
      BUILDPAIR_PAYMENTS_ENABLED: 'off'
      BUILDPAIR_PREVIEW_DATA: 'off'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buildpair_e2e
      BUILDPAIR_E2E_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Build disposable database
        run: npm run test:e2e:setup
      - name: Start BuildPair test server
        shell: bash
        run: |
          set -euo pipefail
          npx expo start --web --port 8081 > /tmp/buildpair-e2e-server.log 2>&1 &
          echo $! > /tmp/buildpair-e2e-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/health > /tmp/buildpair-e2e-health.json 2>/dev/null; then
              cat /tmp/buildpair-e2e-health.json
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/buildpair-e2e-server.log
              echo "::error::BuildPair E2E server did not become healthy"
              exit 1
            fi
            sleep 2
          done
      - name: Run Homeowner to Tradesperson regression
        run: npm run test:e2e:core
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/buildpair-e2e-server.log || true
