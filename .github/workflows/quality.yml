name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Expo health check
        run: timeout 180s npx --yes expo-doctor@1.20.4
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Export web
        run: npm run build:web
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
      - run: npm audit --omit=dev --audit-level=high
