name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Export web
        run: npm run build:web
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high --json 2>&1)"
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$output"
              exit 0
            fi

            case "$output" in
              *"Service Unavailable"*|*"ETIMEDOUT"*|*"EAI_AGAIN"*|*"ECONNRESET"*|*"502 Bad Gateway"*|*"503 Service Unavailable"*|*"504 Gateway Timeout"*|*"429 Too Many Requests"*)
                echo "npm audit service unavailable (attempt $attempt/3)"
                if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
                ;;
              *)
                printf '%s\n' "$output"
                exit "$code"
                ;;
            esac
          done

          echo "::warning::npm audit service unavailable after 3 attempts; code/build checks passed"
